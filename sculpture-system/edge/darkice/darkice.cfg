[general]
duration        = 0
bufferSecs      = 5
reconnect       = yes

[input]
{% if audio_backend == 'pulse' %}
device          = pulse
{% else %}
device          = mono_capture
{% endif %}
channel         = {{ audio_channels }}
sampleRate      = {{ audio_sample_rate }}
bitsPerSample   = {{ audio_bit_depth }}

[icecast2-0]
bitrateMode     = vbr
quality         = {{ darkice_quality }}
format          = vorbis
server          = {{ control_host }}
port            = 8000
# ponytail: real deploy supplies this via ansible-vault (icecast_source_password).
# The docker dev harness injects its own password at render time.
password        = {{ icecast_source_password | default('hackme') }}
mountPoint      = s{{ id }}-mic.ogg
name            = Sculpture {{ id }} Microphone
description     = Live audio from sculpture {{ id }}
url             = http://{{ control_host }}:8000
genre           = ambient
public          = no
remoteDumpFile  = /tmp/darkice-s{{ id }}.dump
